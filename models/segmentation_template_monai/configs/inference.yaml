# This implements the workflow for applying the network to a directory of CT volumes and saving the predicted
# segmentations in each volume's original space. Use it on top of common.yaml:
#   --config_file "['configs/common.yaml','configs/inference.yaml']" --ckpt_path <run dir>/model.pt \
#   --dataset_dir <folder> --output_dir <folder>

# hyperparameters for you to modify on the command line
num_workers: 4  # number of workers to generate batches with
amp: true

# define various paths
dataset_dir: '@data_root'  # where data is coming from, searched recursively
output_dir: '$os.path.join(@bundle_root, ''predictions'')'  # Patient_XX_seg.nii.gz files are written here

# list all CT volumes in the input directory, the GT.nii.gz files next to them are skipped
file_pattern: 'Patient_*.nii*'
data_list: '$sorted(glob.glob(os.path.join(@dataset_dir, ''**'', @file_pattern), recursive=True))'
# collect data dictionaries for all files
data_dicts: '$[{@image: i} for i in @data_list]'

# same as validation preprocessing in train.yaml
transforms:
- _target_: LoadImaged
  keys: '@image'
  image_only: true
- _target_: EnsureChannelFirstd
  keys: '@image'
- _target_: Orientationd
  keys: '@image'
  axcodes: RAS
- _target_: Spacingd
  keys: '@image'
  pixdim: '@pixdim'
  mode: bilinear
- _target_: ScaleIntensityRanged
  keys: '@image'
  a_min: '$@hu_window[0]'
  a_max: '$@hu_window[1]'
  b_min: 0.0
  b_max: 1.0
  clip: true
- _target_: CropForegroundd
  keys: '@image'
  source_key: '@image'

preprocessing:
  _target_: Compose
  transforms: $@transforms

dataset:
  _target_: Dataset
  data: '@data_dicts'
  transform: '@preprocessing'

dataloader:
  _target_: DataLoader
  dataset: '@dataset'
  batch_size: 1
  num_workers: '@num_workers'

# transform to apply to data from network to save it in the original space of the input volume
postprocessing:
  _target_: Compose
  transforms:
  - _target_: Activationsd
    keys: '@pred'
    softmax: true
  - _target_: Invertd  # undo crop, spacing and orientation so the prediction aligns with the original CT
    keys: '@pred'
    transform: '@preprocessing'
    orig_keys: '@image'
    nearest_interp: false  # interpolate the probabilities, then take the argmax
    to_tensor: true
  - _target_: AsDiscreted
    keys: '@pred'
    argmax: true
  - _target_: SaveImaged
    keys: '@pred'
    output_dir: '@output_dir'
    output_postfix: seg
    output_dtype: $numpy.uint8
    resample: false
    separate_folder: false

# inference handlers to load checkpoint, gather statistics
handlers:
- _target_: CheckpointLoader  # fails if ckpt_path is missing, rather than predicting with random weights
  load_path: '@ckpt_path'
  load_dict:
    model: '@network'
- _target_: StatsHandler
  name: null  # use engine.logger as the Logger object to log to
  output_transform: '$lambda x: None'

# engine for running inference, ties together objects defined above
evaluator:
  _target_: SupervisedEvaluator
  device: '@device'
  val_data_loader: '@dataloader'
  network: '@network'
  inferer: '@sw_inferer'
  postprocessing: '@postprocessing'
  amp: '@amp'
  val_handlers: '@handlers'

run:
- $@evaluator.run()
