# This implements the workflow for evaluating a trained network on labelled volumes, by default the validation
# patients of `fold`. Predictions are mapped back to each CT's original orientation and spacing before the Dice is
# computed against the unmodified GT.nii.gz. Use it on top of common.yaml:
#   --config_file "['configs/common.yaml','configs/test.yaml']" --fold 0 --ckpt_path <run dir>/model.pt

# hyperparameters for you to modify on the command line
num_workers: 4  # number of workers to generate batches with
save_pred: false  # whether to save prediction images or just run metric tests
amp: true

# define various paths
output_dir: '$os.path.join(@bundle_root, ''eval'', ''fold'' + str(@fold))'  # where metrics (and predictions) go

# patients to evaluate, override on the command line to evaluate others, e.g. --patients "['Patient_01']"
patients: '$json.load(open(@folds_file))[''folds''][@fold][''val'']'
data_dicts: '$[{@image: os.path.join(@data_root, p, p + ''.nii.gz''), @label: os.path.join(@data_root, p, ''GT.nii.gz'')} for p in @patients]'

# same as validation preprocessing in train.yaml, but only the image is resampled: the label stays in its original
# space to compare against the inverted predictions
transforms:
- _target_: LoadImaged
  keys: ['@image', '@label']
  image_only: true
- _target_: EnsureChannelFirstd
  keys: ['@image', '@label']
- _target_: Orientationd
  keys: '@image'
  axcodes: RAS
- _target_: Spacingd
  keys: '@image'
  pixdim: '@pixdim'
  mode: bilinear
- _target_: ScaleIntensityRanged
  keys: '@image'
  a_min: '$@hu_window[0]'
  a_max: '$@hu_window[1]'
  b_min: 0.0
  b_max: 1.0
  clip: true
- _target_: CropForegroundd
  keys: '@image'
  source_key: '@image'

preprocessing:
  _target_: Compose
  transforms: $@transforms

dataset:
  _target_: Dataset
  data: '@data_dicts'
  transform: '@preprocessing'

dataloader:
  _target_: DataLoader
  dataset: '@dataset'
  batch_size: 1
  num_workers: '@num_workers'

# transform to apply to data from network to be suitable for metrics
postprocessing:
  _target_: Compose
  transforms:
  - _target_: Activationsd
    keys: '@pred'
    softmax: true
  - _target_: Invertd  # undo crop, spacing and orientation so the prediction aligns with the original CT
    keys: '@pred'
    transform: '@preprocessing'
    orig_keys: '@image'
    nearest_interp: false  # interpolate the probabilities, then take the argmax
    to_tensor: true
  - _target_: AsDiscreted
    keys: '@pred'
    argmax: true
  - _target_: SaveImaged
    _disabled_: '$not @save_pred'
    keys: '@pred'
    output_dir: '@output_dir'
    output_postfix: seg
    output_dtype: $numpy.uint8
    resample: false
    separate_folder: false
  - _target_: AsDiscreted
    keys: ['@pred', '@label']
    to_onehot: '@num_classes'

# inference handlers to load checkpoint, gather statistics
handlers:
- _target_: CheckpointLoader  # fails if ckpt_path is missing, rather than evaluating random weights
  load_path: '@ckpt_path'
  load_dict:
    model: '@network'
- _target_: StatsHandler
  name: null  # use engine.logger as the Logger object to log to
  output_transform: '$lambda x: None'
- _target_: MetricsSaver  # per-patient, per-organ Dice in val_mean_dice_raw.csv, columns class0..3 are the organs 1..4
  save_dir: '@output_dir'
  metrics: [val_mean_dice]
  metric_details: [val_mean_dice]
  batch_transform: '$lambda batch: [x[''image''].meta for x in batch]'
  summary_ops: '*'

# engine for running inference, ties together objects defined above and has metric definitions
evaluator:
  _target_: SupervisedEvaluator
  device: '@device'
  val_data_loader: '@dataloader'
  network: '@network'
  inferer: '@sw_inferer'
  postprocessing: '@postprocessing'
  amp: '@amp'
  key_val_metric:
    val_mean_dice:
      _target_: MeanDice
      include_background: false
      output_transform: $monai.handlers.from_engine([@pred, @label])
  val_handlers: '@handlers'

run:
- $@evaluator.run()
- '$print(''Mean Dice per organ (esophagus, heart, trachea, aorta):'', @evaluator.state.metric_details[''val_mean_dice''].nanmean(0).cpu().numpy())'
